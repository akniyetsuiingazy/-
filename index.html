<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Саған ❤️</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background: radial-gradient(circle at top, #0b0f2a, #050714 70%);
    overflow:hidden;
    text-align:center;
    color:white;
}

/* STARS */
.star{
    position:fixed;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    opacity:0.8;
    animation:moveStar linear infinite;
}

@keyframes moveStar{
    from{transform:translateY(0);}
    to{transform:translateY(100vh);}
}

.container{
    padding:60px 20px;
    position:relative;
    z-index:2;
}

h1{
    font-size:48px;
}

.card{
    background:rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    max-width:650px;
    margin:30px auto;
    padding:30px;
    border-radius:20px;
}

/* BUTTON COLUMN */
.button-row{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    margin-top:15px;
}

button{
    width:240px;
    padding:14px 18px;
    border:none;
    border-radius:25px;
    font-size:15px;
    cursor:pointer;
    background:#ff4b6e;
    color:white;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
    background:#ff2f56;
}

/* MESSAGE */
#message{
    margin-top:20px;
    font-size:22px;
    opacity:0;
    transform:scale(0.8);
    transition:0.4s;
}

#message.show{
    opacity:1;
    transform:scale(1.1);
}

/* HEARTS */
.heart{
    position:fixed;
    font-size:26px;
    pointer-events:none;
    z-index:9999;
    animation:explode 1.8s ease-out forwards;
}

@keyframes explode{
    0%{
        transform:translate(0,0) scale(0.5);
        opacity:1;
    }
    100%{
        transform:translate(var(--x), var(--y)) scale(1.8);
        opacity:0;
    }
}

/* SECRET */
.secret-page{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:radial-gradient(circle,#ff9a9e,#0b0f2a);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:999;
    flex-direction:column;
}

.secret-text{
    font-size:44px;
}

.close-x{
    position:absolute;
    top:20px;
    right:25px;
    font-size:32px;
    cursor:pointer;
    color:white;
    transition:0.3s;
}

.close-x:hover{
    transform:scale(1.3);
    color:black;
}
</style>
</head>

<body>

<!-- 🎵 MUSIC -->
<audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<div class="container">

<h1>❤️ Сен ерекше жансың ❤️</h1>

<div class="card">

<p id="typing"></p>

<div class="button-row">
    <button onclick="sendLove()">Жүрек ❤️</button>
    <button onclick="hug()">Обнимашки 🤗</button>
    <button onclick="compliment()">Комплимент ✨</button>
    <button onclick="showSecret()">🔐 Құпия</button>
</div>

<p id="message"></p>

</div>
</div>

<!-- SECRET -->
<div id="secretPage" class="secret-page">
    <div class="close-x" onclick="closeSecret()">×</div>
    <div class="secret-text">Сен мен үшін өте маңызды адамсың ❤️</div>
</div>

<script>

/* typing */
const text="Қандай жағдай болса да, сен жалғыз емессің. Сен күшті, маңызды және бағалы адамсың.";
let i=0;

function typing(){
    if(i<text.length){
        document.getElementById("typing").innerHTML+=text.charAt(i);
        i++;
        setTimeout(typing,40);
    }
}
typing();

/* stars */
function createStar(){
    let s=document.createElement("div");
    s.className="star";
    s.style.left=Math.random()*100+"vw";
    s.style.top="-10px";
    s.style.animationDuration=(5+Math.random()*5)+"s";
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),10000);
}
setInterval(createStar,200);

/* MUSIC */
const music = document.getElementById("bgMusic");
music.volume = 0.4;

function startMusic(){
    music.play().catch(()=>{});
}

document.addEventListener("click", startMusic, { once:true });
document.addEventListener("touchstart", startMusic, { once:true });

/* HEARTS */
function sendLove(){
    for(let i=0;i<40;i++){
        let h=document.createElement("div");
        h.className="heart";
        h.innerHTML="💗";

        let x=window.innerWidth/2;
        let y=window.innerHeight/2;

        h.style.left=x+"px";
        h.style.top=y+"px";

        let angle=Math.random()*Math.PI*2;
        let dist=120+Math.random()*280;

        h.style.setProperty("--x",Math.cos(angle)*dist+"px");
        h.style.setProperty("--y",Math.sin(angle)*dist+"px");

        document.body.appendChild(h);
        setTimeout(()=>h.remove(),2000);
    }
}

/* 💬 HUG MESSAGE */
function hug(){
    let el=document.getElementById("message");
    el.innerText="Напиши мне: хочу Обнимашки!🤗";
    el.classList.remove("show");
    void el.offsetWidth;
    el.classList.add("show");
}

/* compliment */
const compliments=[
"Сен әлемді жарық қыласың.",
"Сен өте ерекше жансың.",
"Сен бақытқа лайықсың.",
"Сен күштісің.",
"Сен шабыт бересің."
];

function compliment(){
    let el=document.getElementById("message");
    el.innerText=compliments[Math.floor(Math.random()*compliments.length)];
    el.classList.remove("show");
    void el.offsetWidth;
    el.classList.add("show");
}

/* secret */
function showSecret(){
    document.getElementById("secretPage").style.display="flex";
}

function closeSecret(){
    document.getElementById("secretPage").style.display="none";
}

</script>

</body>
</html>
